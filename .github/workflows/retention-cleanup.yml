name: Retention cleanup

on:
  schedule:
    # Semanal, domingo ~06:00 UTC — isto é faxina, não é sensível a horário
    # como o digest diário de lembretes. Minuto 23 em vez de 00 pelo mesmo
    # motivo do digest: a hora cheia é o slot mais disputado do agendador
    # do GitHub Actions, onde execuções atrasam ou são descartadas.
    - cron: '23 6 * * 0'
  workflow_dispatch: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    # O caminho feliz leva segundos; isto só evita queimar minutos de Actions
    # se o runner travar fora do curl (DNS/proxy pendurado, por exemplo).
    timeout-minutes: 10
    steps:
      - name: POST /api/system/retention-cleanup
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BACKEND_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Configure os secrets BACKEND_URL e CRON_SECRET nas settings do repositório (Settings > Secrets and variables > Actions) antes de habilitar este workflow."
            exit 1
          fi

          # Mesma forma do reminder-digest: -sS mantém a mensagem de erro de
          # transporte visível, e uma falha de rede derruba o passo aqui via
          # `set -e`, antes de qualquer comparação numérica com $http_code.
          # A primeira execução depois do deploy apaga todo o backlog
          # acumulado de uma vez, então o --max-time é generoso.
          http_code=$(curl -sS --max-time 300 \
            -o /tmp/retention-response.json -w '%{http_code}' \
            -X POST "${BACKEND_URL%/}/api/system/retention-cleanup" \
            -H "X-Cron-Secret: ${CRON_SECRET}")

          cat /tmp/retention-response.json
          echo ""

          # Sem checagem extra do corpo (diferente do digest): aqui não existe
          # contador de falha parcial engolido num 200 — se um DELETE falhar,
          # o serviço propaga o erro e a resposta já vira 5xx.
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::retention-cleanup respondeu HTTP $http_code"
            exit 1
          fi
